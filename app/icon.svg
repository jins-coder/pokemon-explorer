<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <clipPath id="top-half">
      <rect x="0" y="0" width="32" height="16" />
    </clipPath>
    <clipPath id="bottom-half">
      <rect x="0" y="16" width="32" height="16" />
    </clipPath>
  </defs>

  <!-- Outer Circle Background -->
  <circle cx="16" cy="16" r="14" fill="#EF4444" clip-path="url(#top-half)" stroke="#18181B" stroke-width="2.5" />
  <circle cx="16" cy="16" r="14" fill="#FFFFFF" clip-path="url(#bottom-half)" stroke="#18181B" stroke-width="2.5" />

  <!-- Center Black Line -->
  <line x1="2" y1="16" x2="30" y2="16" stroke="#18181B" stroke-width="2.5" />

  <!-- Center Button Outer Ring -->
  <circle cx="16" cy="16" r="5" fill="#FFFFFF" stroke="#18181B" stroke-width="2.5" />

  <!-- Center Button Inner Circle -->
  <circle cx="16" cy="16" r="2" fill="#E4E4E7" stroke="#18181B" stroke-width="1.2" />
</svg>
